name: Codex plan review and auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number to resume
        required: true
        type: string
      head_sha:
        description: Exact pull request head to review
        required: true
        type: string

concurrency:
  group: >-
    codex-plan-review-${{
      github.event.pull_request.number ||
      github.event.issue.number ||
      inputs.pull_number ||
      github.run_id
    }}
  cancel-in-progress: true

jobs:
  retrigger:
    if: >-
      github.event_name == 'issue_comment' ||
      github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: read
      pull-requests: read
    steps:
      - name: Resume the exact-head gate after a native Codex event
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const isComment = context.eventName === "issue_comment";
            const pull_number = isComment
              ? context.payload.issue?.number
              : context.payload.pull_request?.number;
            if (!pull_number || (isComment && !context.payload.issue?.pull_request)) {
              core.info("This event is not attached to a pull request.");
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });
            const codexLogin = "chatgpt-codex-connector[bot]";
            const trusted = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            let shouldResume = false;

            if (isComment) {
              const comment = context.payload.comment;
              const requestedByContributor =
                trusted.has(comment.author_association) &&
                /(^|\n)\s*@codex\s+review\b/i.test(comment.body || "");
              const exactHeadResult =
                comment.user?.login === codexLogin &&
                (comment.body || "").includes(
                  `**Reviewed commit:** \`${pr.head.sha.slice(0, 10)}\``,
                );
              shouldResume = requestedByContributor || exactHeadResult;
            } else {
              const review = context.payload.review;
              shouldResume =
                review.user?.login === codexLogin &&
                review.commit_id === pr.head.sha;
            }

            if (!shouldResume) {
              core.info("The event is not a trusted review request or exact-head Codex result.");
              return;
            }
            if (
              pr.state !== "open" ||
              pr.draft ||
              pr.head.repo.full_name !== `${owner}/${repo}` ||
              !trusted.has(pr.author_association)
            ) {
              core.setFailed("The pull request is not eligible for automatic merging.");
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "codex-correction-gate.yml",
              ref: pr.head.ref,
              inputs: {
                pull_number: String(pull_number),
                head_sha: pr.head.sha,
              },
            });
            core.info(`Resumed the gate for pull request #${pull_number} at ${pr.head.sha}.`);

  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      issues: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_number }}
      REVIEWED_HEAD: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
    steps:
      - name: Wait for a plan-backed Codex review of the exact head
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            const reviewedHead = process.env.REVIEWED_HEAD;
            const codexLogin = "chatgpt-codex-connector[bot]";

            // Codex automatically reviews a newly opened or ready PR. After a
            // correction push, a contributor whose GitHub identity is linked to
            // ChatGPT must comment `@codex review`; a GitHub Actions bot cannot
            // borrow a person's ChatGPT plan identity. This job waits for that
            // exact-head native result and never calls the OpenAI API.

            for (let attempt = 0; attempt < 120; attempt += 1) {
              const { data: current } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number,
              });
              if (
                current.state !== "open" ||
                current.draft ||
                current.head.sha !== reviewedHead
              ) {
                core.setFailed("The pull request changed while Codex was reviewing it.");
                return;
              }

              const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                { owner, repo, pull_number, per_page: 100 },
              );
              const codexReview = reviews.find(
                (review) =>
                  review.user?.login === codexLogin &&
                  review.commit_id === reviewedHead,
              );
              if (codexReview) {
                const inlineComments = await github.paginate(
                  github.rest.pulls.listReviewComments,
                  { owner, repo, pull_number, per_page: 100 },
                );
                const reviewText = [
                  codexReview.body || "",
                  ...inlineComments
                    .filter(
                      (comment) =>
                        comment.pull_request_review_id === codexReview.id,
                    )
                    .map((comment) => comment.body || ""),
                ].join("\n");
                if (/P[01]\s+Badge|\[P[01]\]/i.test(reviewText)) {
                  core.setFailed(
                    `Codex found one or more P0/P1 concerns on ${reviewedHead.slice(0, 10)}.`,
                  );
                  return;
                }
                core.info(
                  `Codex reported no blocking P0/P1 concerns on ${reviewedHead.slice(0, 10)}.`,
                );
                return;
              }

              const issueComments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: pull_number, per_page: 100 },
              );
              const reviewedCommit = `**Reviewed commit:** \`${reviewedHead.slice(0, 10)}\``;
              const clean = issueComments.some(
                (comment) =>
                  comment.user?.login === codexLogin &&
                  (comment.body || "").includes(reviewedCommit) &&
                  /didn't find any major issues/i.test(comment.body || ""),
              );
              if (clean) {
                core.info(
                  `Codex found no P0/P1 concerns on ${reviewedHead.slice(0, 10)}.`,
                );
                return;
              }

              if (attempt < 119) {
                await new Promise((resolve) => setTimeout(resolve, 15000));
              }
            }

            core.setFailed(
              "Codex did not finish its plan-backed review within 30 minutes. The pull request remains open.",
            );

  finalize:
    needs: review
    if: needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_number }}
      REVIEWED_HEAD: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
    steps:
      - name: Merge the unchanged clean head after all required checks pass
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            const reviewedHead = process.env.REVIEWED_HEAD;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });
            const trusted = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            if (
              pr.state !== "open" ||
              pr.draft ||
              pr.head.sha !== reviewedHead ||
              pr.head.repo.full_name !== `${owner}/${repo}` ||
              !trusted.has(pr.author_association)
            ) {
              core.setFailed("The pull request changed or is no longer eligible after review.");
              return;
            }

            const { data: baseBranch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: pr.base.ref,
            });
            const requiredStatusChecks = baseBranch.protection?.required_status_checks;
            const configuredChecks = requiredStatusChecks?.checks || [];
            const configuredContexts = requiredStatusChecks?.contexts || [];
            const requiredCheckSpecs = configuredChecks.length > 0
              ? configuredChecks.map(({ context, app_id }) => ({ context, app_id }))
              : configuredContexts.map((context) => ({ context, app_id: null }));

            if (!baseBranch.protected || requiredCheckSpecs.length === 0) {
              core.setFailed(
                `Base branch ${pr.base.ref} has no required checks; refusing to merge.`,
              );
              return;
            }

            const acceptable = new Set(["success", "neutral", "skipped"]);
            for (let attempt = 0; attempt < 20; attempt += 1) {
              const checks = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: reviewedHead,
                per_page: 100,
                filter: "latest",
              });
              const statuses = await github.paginate(
                github.rest.repos.listCommitStatusesForRef,
                { owner, repo, ref: reviewedHead, per_page: 100 },
              );
              const latestStatusesByContext = new Map();
              for (const status of statuses) {
                const current = latestStatusesByContext.get(status.context);
                if (
                  !current ||
                  Date.parse(status.created_at) > Date.parse(current.created_at)
                ) {
                  latestStatusesByContext.set(status.context, status);
                }
              }
              const latestStatuses = [...latestStatusesByContext.values()];
              const requiredChecks = requiredCheckSpecs.map((required) => ({
                ...required,
                check: checks.find(
                  (candidate) =>
                    candidate.name === required.context &&
                    (required.app_id == null || candidate.app?.id === required.app_id),
                ),
                status: required.app_id == null
                  ? latestStatuses.find(
                      (candidate) => candidate.context === required.context,
                    )
                  : undefined,
              }));
              const failedRequired = requiredChecks.find(
                ({ check, status }) =>
                  (check?.status === "completed" &&
                    !acceptable.has(check.conclusion)) ||
                  ["error", "failure"].includes(status?.state),
              );
              if (failedRequired) {
                core.setFailed(`Required check ${failedRequired.context} failed.`);
                return;
              }

              const pendingRequired = requiredChecks.find(
                ({ check, status }) =>
                  (!check && !status) ||
                  (check && check.status !== "completed") ||
                  status?.state === "pending",
              );
              if (!pendingRequired) break;
              if (attempt === 19) {
                core.setFailed(
                  `Required check ${pendingRequired.context} did not complete successfully.`,
                );
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

            const { data: current } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });
            if (current.state !== "open" || current.head.sha !== reviewedHead) {
              core.setFailed("The pull request changed before merge.");
              return;
            }

            const merge = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number,
              sha: reviewedHead,
              merge_method: "squash",
              commit_title: `${current.title} (#${pull_number})`,
            });
            if (!merge.data.merged) {
              core.setFailed(merge.data.message || "GitHub declined the automatic merge.");
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "publish-site-feed.yml",
              ref: "main",
            });

            core.info(`Squash-merged pull request #${pull_number} at ${reviewedHead}.`);

name: Codex follow-up review

on:
  pull_request:
    types: [synchronize]

concurrency:
  group: codex-follow-up-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      result: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Check out the exact pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare trusted review context
        uses: actions/github-script@v7
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const codexLogins = new Set([
              "chatgpt-codex-connector[bot]",
              "github-actions[bot]",
            ]);

            const inlineComments = await github.paginate(
              github.rest.pulls.listReviewComments,
              { owner, repo, pull_number, per_page: 100 },
            );
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const previousFindings = inlineComments
              .filter((comment) =>
                codexLogins.has(comment.user?.login) &&
                /P[01]\s+Badge|\[P[01]\]/i.test(comment.body || ""),
              )
              .map((comment) => ({
                kind: "inline",
                path: comment.path || "",
                body: (comment.body || "").slice(0, 4000),
              }));

            const previousFollowUps = reviews
              .filter((review) =>
                codexLogins.has(review.user?.login) &&
                /Codex follow-up review/i.test(review.body || ""),
              )
              .map((review) => ({
                kind: "review",
                body: (review.body || "").slice(0, 8000),
              }));

            const reviewContext = {
              repository: `${owner}/${repo}`,
              pull_number,
              base_sha: process.env.BASE_SHA,
              head_sha: process.env.HEAD_SHA,
              previous_codex_feedback: [
                ...previousFindings,
                ...previousFollowUps,
              ].slice(-40),
            };

            fs.writeFileSync(
              ".codex-follow-up-context.json",
              JSON.stringify(reviewContext, null, 2),
            );

      - name: Review the updated pull request with Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/follow-up-review.md
          codex-args: '["--ephemeral","--search","--output-schema",".github/codex/review-schema.json"]'
          sandbox: workspace-write
          safety-strategy: drop-sudo

  finalize:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    steps:
      - name: Post the exact-head review and merge only a clean result
        uses: actions/github-script@v7
        env:
          CODEX_RESULT: ${{ needs.review.outputs.result }}
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const reviewedHead = process.env.REVIEWED_HEAD;
            const marker = `<!-- codex-follow-up:${reviewedHead} -->`;

            let result;
            try {
              result = JSON.parse(process.env.CODEX_RESULT || "");
            } catch (error) {
              core.setFailed(`Codex returned invalid structured output: ${error.message}`);
              return;
            }

            if (
              result.reviewed_commit !== reviewedHead ||
              !["clean", "needs_changes"].includes(result.verdict) ||
              !Array.isArray(result.findings)
            ) {
              core.setFailed("Codex output did not match the exact pull request head and review contract.");
              return;
            }
            if (result.verdict === "clean" && result.findings.length !== 0) {
              core.setFailed("Codex marked the commit clean but also returned findings.");
              return;
            }
            if (result.verdict === "needs_changes" && result.findings.length === 0) {
              core.setFailed("Codex requested changes without an actionable finding.");
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });
            const trusted = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            if (
              pr.state !== "open" ||
              pr.draft ||
              pr.head.sha !== reviewedHead ||
              pr.head.repo.full_name !== `${owner}/${repo}` ||
              !trusted.has(pr.author_association)
            ) {
              core.setFailed("The pull request changed or is no longer eligible after Codex reviewed it.");
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const alreadyReviewed = reviews.some((review) =>
              (review.body || "").includes(marker),
            );

            if (result.verdict === "needs_changes") {
              if (alreadyReviewed) {
                core.setFailed("This exact commit already has a blocking follow-up review.");
                return;
              }
              const findings = result.findings.map((finding) => {
                const location = finding.location ? ` — ${finding.location}` : "";
                return `- **[${finding.priority}] ${finding.title}**${location}\n  ${finding.details}`;
              });
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number,
                commit_id: reviewedHead,
                event: "COMMENT",
                body: [
                  "### Codex follow-up review — changes needed",
                  "",
                  `**Reviewed commit:** \`${reviewedHead.slice(0, 10)}\``,
                  "",
                  result.summary,
                  "",
                  ...findings,
                  "",
                  "Push another correction commit after addressing these items. Codex will review the new head automatically.",
                  "",
                  marker,
                ].join("\n"),
              });
              core.setFailed(`Codex found ${result.findings.length} blocking concern(s).`);
              return;
            }

            if (!alreadyReviewed) {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number,
                commit_id: reviewedHead,
                event: "COMMENT",
                body: [
                  "### Codex follow-up review — clean",
                  "",
                  `**Reviewed commit:** \`${reviewedHead.slice(0, 10)}\``,
                  "",
                  result.summary,
                  "",
                  "No P0/P1 concerns remain for this pull request head. The automatic merge gate is checking the remaining CI results.",
                  "",
                  marker,
                ].join("\n"),
              });
            }

            const acceptable = new Set(["success", "neutral", "skipped"]);
            for (let attempt = 0; attempt < 20; attempt += 1) {
              const checks = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: reviewedHead,
                per_page: 100,
                filter: "latest",
              });
              const statuses = await github.paginate(
                github.rest.repos.listCommitStatusesForRef,
                { owner, repo, ref: reviewedHead, per_page: 100 },
              );
              const otherChecks = checks.filter(
                (check) => !check.details_url?.includes(`/actions/runs/${context.runId}/`),
              );
              const failedCheck = otherChecks.find(
                (check) => check.status === "completed" && !acceptable.has(check.conclusion),
              );
              const failedStatus = statuses.find((status) =>
                ["error", "failure"].includes(status.state),
              );
              if (failedCheck || failedStatus) {
                const name = failedCheck?.name || failedStatus?.context || "another check";
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull_number,
                  body: `Codex cleared \`${reviewedHead.slice(0, 10)}\`, but **${name}** failed. The pull request remains open.`,
                });
                core.setFailed(`${name} failed.`);
                return;
              }

              const pending = otherChecks.some((check) => check.status !== "completed") ||
                statuses.some((status) => status.state === "pending");
              if (!pending) break;
              if (attempt === 19) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull_number,
                  body: `Codex cleared \`${reviewedHead.slice(0, 10)}\`, but another check is still pending. The pull request remains open.`,
                });
                core.setFailed("Another check remained pending.");
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

            const { data: current } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });
            if (current.state !== "open" || current.head.sha !== reviewedHead) {
              core.setFailed("The pull request changed before the merge could be completed.");
              return;
            }

            const merge = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number,
              sha: reviewedHead,
              merge_method: "squash",
              commit_title: `${current.title} (#${pull_number})`,
            });
            if (!merge.data.merged) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `Codex cleared \`${reviewedHead.slice(0, 10)}\`, but GitHub declined the automatic merge: ${merge.data.message || "unknown reason"}`,
              });
              core.setFailed(merge.data.message || "GitHub declined the automatic merge.");
              return;
            }

            core.info(`Squash-merged pull request #${pull_number} at ${reviewedHead}.`);
